services:
  - type: web
    name: helpearly-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    plan: free
    autoDeploy: false
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://atyour-service.vercel.app
      - key: NODE_VERSION
        value: 22.14.0
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: DB_POOL_MAX
        value: 5
      - key: DB_SSL
        value: true
      - key: DB_SSL_ALLOW_SELF_SIGNED
        value: false
      - key: RUN_BACKGROUND_WORKER
        value: true
      - key: LOG_REQUESTS
        value: true
      - key: TRUST_PROXY
        value: 1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PUSH_ENABLED
        value: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
