<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#00838f"/>
      <stop offset="100%" stop-color="#004d5c"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- House roof (white) -->
  <polyline points="8,30 32,10 56,30"
    fill="none" stroke="white" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- House walls -->
  <line x1="11" y1="28" x2="11" y2="54" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="53" y1="28" x2="53" y2="54" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Window grid -->
  <rect x="27" y="16" width="5" height="5" rx="1" fill="white"/>
  <rect x="33" y="16" width="5" height="5" rx="1" fill="white"/>
  <rect x="27" y="22" width="5" height="5" rx="1" fill="white"/>
  <rect x="33" y="22" width="5" height="5" rx="1" fill="white"/>
  <!-- Checkmark badge (bottom-right) -->
  <circle cx="49" cy="49" r="12" fill="#00bcd4"/>
  <polyline points="43,49 47,53 56,43" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
