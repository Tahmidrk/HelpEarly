<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Background gradient: dark teal (top-left) → light teal/cyan (bottom-right) -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="80%">
      <stop offset="0%"   stop-color="#00838f"/>
      <stop offset="55%"  stop-color="#00697a"/>
      <stop offset="100%" stop-color="#004d5c"/>
    </radialGradient>

    <!-- Worker body gradient: lighter teal -->
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>

    <!-- Worker overalls / dark part -->
    <linearGradient id="overallsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00838f"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>

    <!-- Speech bubble swoosh (left, teal) -->
    <linearGradient id="swooshLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>

    <!-- Rounded rect clip -->
    <clipPath id="roundedClip">
      <rect width="400" height="400" rx="80" ry="80"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="400" height="400" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- ── House outline (white, thick stroke, no fill) ── -->
  <!-- Roof -->
  <polyline
    points="70,185  200,72  330,185"
    fill="none" stroke="white" stroke-width="22"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left wall -->
  <line x1="88" y1="175" x2="88"  y2="330" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <!-- Right wall -->
  <line x1="312" y1="175" x2="312" y2="330" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <!-- Chimney (right side of roof) -->
  <rect x="274" y="88" width="28" height="52" rx="5" fill="none" stroke="white" stroke-width="16" stroke-linejoin="round"/>

  <!-- Window grid (4 squares, white, near roof peak) -->
  <rect x="180" y="108" width="18" height="18" rx="3" fill="white"/>
  <rect x="202" y="108" width="18" height="18" rx="3" fill="white"/>
  <rect x="180" y="130" width="18" height="18" rx="3" fill="white"/>
  <rect x="202" y="130" width="18" height="18" rx="3" fill="white"/>

  <!-- ── Left speech bubble / leaf swoosh (teal) ── -->
  <path
    d="M 62,240  Q 30,310  55,355  Q 80,395  118,365  Q 88,330  100,290  Z"
    fill="url(#swooshLeft)" opacity="0.95"/>
  <path
    d="M 62,240  Q 48,270  62,300  Q 80,270  100,255  Z"
    fill="url(#swooshLeft)" opacity="0.85"/>

  <!-- ── Right speech bubble (white/very light) ── -->
  <path
    d="M 338,240  Q 372,305  348,355  Q 324,395  286,368  Q 315,332  302,292  Z"
    fill="white" opacity="0.28"/>
  <path
    d="M 338,240  Q 352,268  338,298  Q 320,272  302,258  Z"
    fill="white" opacity="0.22"/>

  <!-- ── Worker figure (LEFT) ── -->
  <!-- Head -->
  <circle cx="148" cy="224" r="30" fill="url(#workerGrad)"/>
  <!-- Cap brim -->
  <ellipse cx="148" cy="202" rx="33" ry="10" fill="url(#overallsGrad)"/>
  <!-- Cap dome -->
  <path d="M 115,206 Q 115,178 148,178 Q 181,178 181,206 Z" fill="url(#workerGrad)"/>
  <!-- Cap button -->
  <circle cx="148" cy="180" r="5" fill="url(#overallsGrad)"/>
  <!-- Body / torso -->
  <ellipse cx="148" cy="305" rx="46" ry="55" fill="url(#workerGrad)"/>
  <!-- Overalls bib -->
  <rect x="122" y="264" width="52" height="48" rx="8" fill="url(#overallsGrad)"/>
  <!-- Strap left -->
  <rect x="126" y="252" width="13" height="22" rx="4" fill="url(#overallsGrad)"/>
  <!-- Strap right -->
  <rect x="161" y="252" width="13" height="22" rx="4" fill="url(#overallsGrad)"/>
  <!-- Buckle whites -->
  <rect x="126" y="252" width="13" height="8" rx="2" fill="white" opacity="0.5"/>
  <rect x="161" y="252" width="13" height="8" rx="2" fill="white" opacity="0.5"/>

  <!-- ── Clipboard (CENTER) ── -->
  <rect x="188" y="215" width="72" height="98" rx="8" fill="#e0f7fa" stroke="#b2ebf2" stroke-width="2"/>
  <!-- Clip -->
  <rect x="206" y="206" width="36" height="18" rx="6" fill="#80deea"/>
  <circle cx="224" cy="206" r="9" fill="#00838f"/>
  <!-- Clipboard house icon -->
  <polyline points="204,250  224,236  244,250" fill="none" stroke="#00697a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="211" y="249" width="26" height="19" rx="2" fill="#00838f" opacity="0.85"/>
  <!-- Lines -->
  <rect x="200" y="278" width="48" height="5" rx="2" fill="#80deea"/>
  <rect x="200" y="288" width="34" height="5" rx="2" fill="#80deea"/>
  <!-- Checkmark circle -->
  <circle cx="224" cy="310" r="13" fill="#00bcd4"/>
  <polyline points="217,310  222,316  232,303" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Household person silhouette (RIGHT, white) ── -->
  <circle cx="284" cy="228" r="28" fill="white" opacity="0.30"/>
  <ellipse cx="284" cy="306" rx="36" ry="44" fill="white" opacity="0.28"/>
</svg>
